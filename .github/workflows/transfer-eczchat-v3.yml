name: Transferir ECZChat 3.0
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/eczchat-v3-transfer-trigger.txt'
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar paquete firmado
        shell: bash
        env:
          URL_B64: 
        run: |
          set -euxo pipefail
          URL="$(printf '%s' "$URL_B64" | base64 -d)"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o ECZChat_B42.18_v3.0_RP_COMPLETO.zip
          unzip -t ECZChat_B42.18_v3.0_RP_COMPLETO.zip >/dev/null
          sha256sum ECZChat_B42.18_v3.0_RP_COMPLETO.zip
      - name: Subir artefacto transferible
        uses: actions/upload-artifact@v4
        with:
          name: ECZChat_B42.18_v3.0_RP_COMPLETO
          path: ECZChat_B42.18_v3.0_RP_COMPLETO.zip
          retention-days: 1
